# Mip-NeRF 360 COLMAP scene defaults. Use --data to select bonsai or counter.
paths:
  data: ../data/bonsai
  output: ../outputs/default.png
  init_ply: null
runtime:
  arch: gpu
  seed: 7
model:
  width: 390
  height: 260
  capacity: 100000
  background: black
training:
  iterations: 8000
learning_rates:
  position_max_steps: 8000
densification:
  interval: 100
  fraction: 0.2
convergence:
  enabled: false
reporting:
  eval_views: 8
  eval_every: 500
  snapshot_every: 2000
  save_ply: true
experiment:
  kernel: gaussian
